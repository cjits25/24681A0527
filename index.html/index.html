<!DOCTYPE html>
<html lang="en">
<head>

    <style>

            margin: 0;
            font-family: Arial, sans-serif;

            text-align: center;
        }

        header {
            background-color: #0d47a1;
            color: white;
            padding: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        .container {
            margin-top: 120px;
        }

        .container h2 {
            color: #0d47a1;
            font-size: 28px;
        }

        .btn {
            display: inline-block;
            padding: 15px 35px;
            margin: 15px;
            background-color: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #0d47a1;
            transform: scale(1.05);
        }

        footer {
            position: fixed;
            bottom: 0;

            background-color: #0d47a1;
